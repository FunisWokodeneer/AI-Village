name: Complete Next Release items

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Preview matching items without changing the Project board"
        type: boolean
        required: true
        default: true

permissions:
  contents: read

concurrency:
  group: complete-next-release
  cancel-in-progress: false

jobs:
  complete-project-items:
    name: Mark Next Release items as Done
    runs-on: ubuntu-latest
    # Configure this environment with required reviewers. Keep the PAT as an
    # environment secret so it is unavailable until the deployment is approved.
    environment: project-item-updates
    steps:
      - name: Update AI Village project
        env:
          GH_TOKEN: ${{ secrets.AI_VILLAGE_PROJECTS_TOKEN }}
          PROJECT_OWNER: FunisWokodeneer
          PROJECT_NUMBER: "3"
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "${GH_TOKEN:-}" ]]; then
            echo "::error::Missing AI_VILLAGE_PROJECTS_TOKEN environment secret. Configure it in the project-item-updates environment."
            exit 1
          fi

          project_json="$(gh api graphql \
            -f query='query($login: String!, $number: Int!) { user(login: $login) { projectV2(number: $number) { id fields(first: 100) { nodes { ... on ProjectV2SingleSelectField { id name options { id name } } } } } } }' \
            -F login="$PROJECT_OWNER" \
            -F number="$PROJECT_NUMBER")"

          if ! jq -e '(.errors // []) | length == 0' <<<"$project_json" >/dev/null; then
            echo "::error::GitHub returned GraphQL errors while looking up the Project."
            exit 1
          fi

          project_id="$(jq -r '.data.user.projectV2.id // empty' <<<"$project_json")"
          status_field_id="$(jq -r '[.data.user.projectV2.fields.nodes[]? | select(.name == "Status") | .id] | if length == 1 then .[0] else empty end' <<<"$project_json")"
          next_release_option_id="$(jq -r '[.data.user.projectV2.fields.nodes[]? | select(.name == "Status") | .options[]? | select(.name == "Next Release") | .id] | if length == 1 then .[0] else empty end' <<<"$project_json")"
          done_option_id="$(jq -r '[.data.user.projectV2.fields.nodes[]? | select(.name == "Status") | .options[]? | select(.name == "Done") | .id] | if length == 1 then .[0] else empty end' <<<"$project_json")"

          if [[ -z "$project_id" || -z "$status_field_id" || -z "$next_release_option_id" || -z "$done_option_id" ]]; then
            echo "::error::Could not uniquely find Project #$PROJECT_NUMBER, its Status field, or the Next Release/Done options."
            exit 1
          fi

          cursor=""
          updated=0
          scanned=0
          while :; do
            graphql_args=(-F project="$project_id")
            if [[ -n "$cursor" ]]; then
              graphql_args+=(-F after="$cursor")
            fi

            page="$(gh api graphql \
              -f query='query($project: ID!, $after: String) { node(id: $project) { ... on ProjectV2 { items(first: 100, after: $after) { nodes { id fieldValues(first: 100) { nodes { ... on ProjectV2ItemFieldSingleSelectValue { optionId field { ... on ProjectV2SingleSelectField { name } } } } } } pageInfo { hasNextPage endCursor } } } }' \
              "${graphql_args[@]}")"

            if ! jq -e '(.errors // []) | length == 0' <<<"$page" >/dev/null; then
              echo "::error::GitHub returned GraphQL errors while reading Project items."
              exit 1
            fi
            if [[ "$(jq -r '.data.node.items.pageInfo.hasNextPage // "missing"' <<<"$page")" == "missing" ]]; then
              echo "::error::Project item query returned an unexpected response."
              exit 1
            fi

            mapfile -t item_ids < <(jq -r --arg field "Status" --arg option "$next_release_option_id" '
              .data.node.items.nodes[]?
              | select(any(.fieldValues.nodes[]?; .field.name == $field and .optionId == $option))
              | .id
            ' <<<"$page")

            page_count="$(jq '.data.node.items.nodes | length' <<<"$page")"
            scanned=$((scanned + page_count))

            for item_id in "${item_ids[@]}"; do
              [[ -z "$item_id" ]] && continue

              if [[ "$DRY_RUN" == "true" ]]; then
                echo "Dry run: would mark project item $item_id as Done."
                continue
              fi

              mutation="$(gh api graphql \
                -f query='mutation($project: ID!, $item: ID!, $field: ID!, $option: String!) { updateProjectV2ItemFieldValue(input: {projectId: $project, itemId: $item, fieldId: $field, value: {singleSelectOptionId: $option}}) { projectV2Item { id } } }' \
                -F project="$project_id" \
                -F item="$item_id" \
                -F field="$status_field_id" \
                -F option="$done_option_id")"

              if ! jq -e '((.errors // []) | length == 0) and (.data.updateProjectV2ItemFieldValue.projectV2Item.id != null)' <<<"$mutation" >/dev/null; then
                echo "::error::Failed to update project item $item_id. See the GraphQL response for details (no token is printed)."
                exit 1
              fi

              updated=$((updated + 1))
              echo "Marked project item $item_id as Done."
            done

            has_next="$(jq -r '.data.node.items.pageInfo.hasNextPage' <<<"$page")"
            [[ "$has_next" == "true" ]] || break
            cursor="$(jq -r '.data.node.items.pageInfo.endCursor // empty' <<<"$page")"
            if [[ -z "$cursor" ]]; then
              echo "::error::Project pagination indicated another page but returned no cursor."
              exit 1
            fi
          done

          if [[ "$DRY_RUN" == "true" ]]; then
            echo "Dry run complete. Scanned $scanned item(s); no changes were made."
          else
            echo "Finished. Scanned $scanned item(s) and updated $updated item(s) from Next Release to Done."
          fi
