name: Build Windows App

on:
  workflow_dispatch:
  push:
    branches: [main, feature/windows-gui]
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    name: Build native Windows GUI
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Resolve dependencies
        run: go mod tidy

      - name: Test
        run: go test ./...

      - name: Install manifest resource compiler
        run: |
          go install github.com/akavel/rsrc@latest
          $env:PATH = "$(go env GOPATH)\\bin;$env:PATH"
          rsrc -manifest app.manifest -o rsrc_windows_amd64.syso

      - name: Build GUI executable
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          go build -trimpath -ldflags="-s -w -H=windowsgui -linkmode=internal" -o dist/AI-Village-windows-x64.exe .

      - name: Verify executable exists
        run: |
          if (-not (Test-Path "dist/AI-Village-windows-x64.exe")) {
            throw "The Windows executable was not created."
          }
          Get-Item "dist/AI-Village-windows-x64.exe" | Format-List Name,Length

      - name: Upload Windows executable
        uses: actions/upload-artifact@v4
        with:
          name: AI-Village-windows-x64
          path: dist/AI-Village-windows-x64.exe
          if-no-files-found: error
          retention-days: 30

      - name: Publish executable to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'latest' }}
          target_commitish: ${{ github.sha }}
          name: ${{ startsWith(github.ref, 'refs/tags/v') && format('AI Village {0}', github.ref_name) || 'AI Village — Latest build' }}
          prerelease: ${{ !startsWith(github.ref, 'refs/tags/v') }}
          make_latest: ${{ startsWith(github.ref, 'refs/tags/v') }}
          files: dist/AI-Village-windows-x64.exe
          generate_release_notes: true
