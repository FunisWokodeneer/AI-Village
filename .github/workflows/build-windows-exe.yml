name: Build Windows App

on:
  workflow_dispatch:
  push:
    branches: [main, feature/windows-gui]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Build native Windows GUI
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Resolve dependencies
        run: go mod tidy

      - name: Test
        run: go test ./...

      - name: Install manifest resource compiler
        run: |
          go install github.com/akavel/rsrc@latest
          $env:PATH = "$(go env GOPATH)\bin;$env:PATH"
          rsrc -manifest app.manifest -o rsrc_windows_amd64.syso

      - name: Build GUI executable
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          go build -trimpath -ldflags="-s -w -H=windowsgui -linkmode=internal" -o dist/AI-Village-windows-x64.exe .

      - name: Verify executable exists
        run: |
          if (-not (Test-Path "dist/AI-Village-windows-x64.exe")) {
            throw "The Windows executable was not created."
          }
          Get-Item "dist/AI-Village-windows-x64.exe" | Format-List Name,Length

      - name: Upload Windows executable
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: AI-Village-windows-x64
          path: dist/AI-Village-windows-x64.exe
          if-no-files-found: error
          retention-days: 30
