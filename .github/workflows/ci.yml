name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Check formatting
        run: test -z "$(gofmt -l .)"
      - name: Test
        run: go test ./...
      - name: Vet
        run: go vet ./...
      - name: Build Windows executable
        env:
          GOOS: windows
          GOARCH: amd64
        run: go build -trimpath -ldflags="-s -w" -o ai-village.exe .
      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: ai-village-windows-amd64
          path: ai-village.exe
          if-no-files-found: error
