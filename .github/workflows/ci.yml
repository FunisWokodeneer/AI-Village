name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Install Ebitengine Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libx11-dev libxrandr-dev libxcursor-dev libxinerama-dev libxi-dev libgl1-mesa-dev libasound2-dev
      - name: Resolve and verify dependencies
        run: go mod tidy
      - name: Show formatting diff
        run: gofmt -d world.go brain.go
      - name: Test
        run: go test ./...
      - name: Vet
        run: go vet ./...
      - name: Print dependency checksums for bootstrap
        run: cat go.sum
