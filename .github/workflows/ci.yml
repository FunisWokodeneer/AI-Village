name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Install Ebitengine Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libx11-dev libxrandr-dev libxcursor-dev libxinerama-dev libxi-dev libxxf86vm-dev libgl1-mesa-dev libasound2-dev xvfb
      - name: Resolve and verify dependencies
        run: go mod tidy
      - name: Check formatting
        run: test -z "$(gofmt -l .)"
      - name: Test
        run: xvfb-run -a go test ./...
      - name: Vet
        run: go vet ./...
