name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Show formatting diff
        run: gofmt -d world.go
      - name: Test
        run: go test ./...
      - name: Vet
        run: go vet ./...
